name: branch-naming

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  branch-naming:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        shell: bash
        run: |
          branch="${{ github.head_ref }}"
          pattern='^(feat/phase-[1-3]/week-([1-9]|1[0-2])-[a-z0-9]+(-[a-z0-9]+)*|hotfix/[a-z0-9-]+|chore/governance-[a-z0-9-]+|docs/[a-z0-9-]+)$'

          echo "Branch: ${branch}"

          if [[ ! "${branch}" =~ ${pattern} ]]; then
            echo "::error::Branch name must match one of: feat/phase-N/week-N-short-name, hotfix/name, chore/governance-name, docs/name"
            exit 1
          fi
