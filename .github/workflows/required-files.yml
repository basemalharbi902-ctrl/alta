name: required-files

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  required-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate weekly plan and test report
        shell: bash
        run: |
          branch="${{ github.head_ref }}"

          if [[ ! "${branch}" =~ ^feat/phase-([1-3])/week-([0-9]+)- ]]; then
            echo "Non-feature governance/docs/hotfix branch. Weekly plan gate is not required."
            exit 0
          fi

          phase="${BASH_REMATCH[1]}"
          week="${BASH_REMATCH[2]}"
          plan="docs/phase-${phase}/week-${week}-plan.md"
          test_report="docs/phase-${phase}/week-${week}-test-report.md"

          echo "Expected plan: ${plan}"
          echo "Expected test report: ${test_report}"

          if [[ ! -f "${plan}" ]]; then
            echo "::error::Missing weekly plan ${plan}"
            exit 1
          fi

          if ! grep -Eq '^- نتيجة Codex على الخطة: 100/100$' "${plan}"; then
            echo "::error::Weekly plan must contain exact field line: - نتيجة Codex على الخطة: 100/100"
            exit 1
          fi

          if ! grep -Eq '^[[:space:]]*(php artisan|\./vendor/bin/(pest|phpunit))' "${plan}"; then
            echo "::error::Weekly plan must include an actual Laravel/Pest/PHPUnit test command"
            exit 1
          fi

          if [[ ! -f "${test_report}" ]]; then
            echo "::error::Missing test report ${test_report}"
            exit 1
          fi

          if ! grep -Eq '^- نتيجة الاختبارات: PASS$' "${test_report}"; then
            echo "::error::Test report must contain exact field line: - نتيجة الاختبارات: PASS"
            exit 1
          fi
